name: fetch-data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas requests histdata
      - name: Fetch market data
        run: python scripts/fetch_market_data.py
      - name: Push to data branch
        run: |
          cd dataout
          git init -b data
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add .
          git commit -m "Market data snapshot ($(date -u +%F))"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
